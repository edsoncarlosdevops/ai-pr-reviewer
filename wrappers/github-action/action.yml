name: 'AI PR Reviewer'
description: 'AI-based PR reviewer powered by DeepSeek'
branding:
  icon: 'message-square'
  color: 'blue'

inputs:
  github_token:
    description: 'GitHub token'
    required: true
  deepseek_api_key:
    description: 'DeepSeek API Key'
    required: true
  exclude_patterns:
    description: 'Comma separated list of glob patterns to exclude'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/../../requirements.txt
    - name: Run AI PR Reviewer
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek_api_key }}
        EXCLUDE_PATTERNS: ${{ inputs.exclude_patterns }}
      run: python ${{ github.action_path }}/../../cli/reviewer.py
